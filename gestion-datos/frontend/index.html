<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de Datos Personales</title>
<style>
  :root { --bg:#f4f2ee; --fg:#1b1b1b; --card:#fff; --line:#d8d4cc; --accent:#b61f45; --ok:#1d7a3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1b1a; --fg:#eeeae4; --card:#262524; --line:#3a3836; --ok:#5cc47e; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:1rem 1.5rem; border-bottom:2px solid var(--accent); }
  h1 { margin:0; font-size:1.3rem; letter-spacing:.03em; }
  nav { display:flex; flex-wrap:wrap; gap:.5rem; padding:1rem 1.5rem; }
  nav button, nav a, .btn { padding:.5rem .9rem; border:1px solid var(--line); background:var(--card); color:var(--fg);
        border-radius:6px; cursor:pointer; text-decoration:none; font-size:.95rem; }
  nav button.on, .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:820px; margin:0 auto; padding:0 1.5rem 3rem; }
  section { display:none; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1.25rem; }
  section.on { display:block; }
  h2 { margin-top:0; font-size:1.1rem; }
  form { display:grid; gap:.7rem; }
  label { display:grid; gap:.25rem; font-size:.9rem; }
  input, select { padding:.5rem; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--fg); font:inherit; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
  .msg { margin-top:.8rem; white-space:pre-line; font-size:.9rem; }
  .ok { color:var(--ok); } .err { color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:.85rem; margin-top:.8rem; }
  th, td { text-align:left; padding:.4rem; border-bottom:1px solid var(--line); }
  .tabla { overflow-x:auto; }
  .ficha { display:flex; gap:1rem; align-items:flex-start; margin-top:.8rem; }
  .ficha img { width:96px; height:96px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .ficha dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:.2rem .8rem; }
  .ficha dt { font-weight:600; }
  @media (max-width:560px) { .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1>GESTIÓN DE DATOS PERSONALES</h1></header>
<nav id="menu"></nav>
<main>
  <section id="crear"><h2>Crear persona</h2><form id="f-crear"></form><div class="msg" id="m-crear"></div></section>

  <section id="modificar"><h2>Modificar datos personales</h2>
    <form id="f-buscar-mod" class="row"><label>Nro. Documento<input name="doc" inputmode="numeric" maxlength="10" required></label>
      <label>&nbsp;<button class="btn" type="submit">Cargar datos</button></label></form>
    <form id="f-modificar" hidden style="margin-top:1rem"></form><div class="msg" id="m-modificar"></div></section>

  <section id="consultar"><h2>Consultar datos personales</h2>
    <form id="f-consultar" class="row"><label>Nro. Documento<input name="doc" inputmode="numeric" maxlength="10"></label>
      <label>&nbsp;<button class="btn primary" type="submit">Consultar (vacío = listar todos)</button></label></form>
    <div class="msg" id="m-consultar"></div><div id="r-consultar"></div></section>

  <section id="borrar"><h2>Borrar persona</h2>
    <form id="f-borrar" class="row"><label>Nro. Documento<input name="doc" inputmode="numeric" maxlength="10" required></label>
      <label>&nbsp;<button class="btn primary" type="submit">Borrar</button></label></form>
    <div class="msg" id="m-borrar"></div></section>

  <section id="logs"><h2>Consultar logs</h2>
    <form id="f-logs">
      <div class="row">
        <label>Tipo<select name="tipo"><option value="">Todos</option><option>CREAR</option><option>MODIFICAR</option><option>CONSULTAR</option><option>BORRAR</option></select></label>
        <label>Documento<input name="documento" inputmode="numeric" maxlength="10"></label>
      </div>
      <div class="row"><label>Desde<input type="date" name="desde"></label><label>Hasta<input type="date" name="hasta"></label></div>
      <button class="btn primary" type="submit">Buscar</button>
    </form>
    <div class="msg" id="m-logs"></div><div class="tabla" id="r-logs"></div></section>
</main>

<script>
const $ = s => document.querySelector(s);
const N8N_URL = 'http://localhost:5678';   // chat de lenguaje natural (n8n)

/* ---------- Menú ---------- */
const OPCIONES = [['crear','Crear Personas'],['modificar','Modificar Datos Personales'],
  ['consultar','Consultar Datos Personales'],['borrar','Borrar Personas'],['logs','Consultar logs']];
const menu = $('#menu');
OPCIONES.forEach(([id, txt]) => { const b = document.createElement('button'); b.textContent = txt; b.dataset.id = id;
  b.onclick = () => mostrar(id); menu.appendChild(b); });
menu.insertAdjacentHTML('beforeend', `<a href="${N8N_URL}" target="_blank" rel="noopener">Consulta en Lenguaje Natural (n8n) ↗</a>`);
function mostrar(id) {
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === id));
  menu.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
}

/* ---------- Utilidades ---------- */
async function api(url, opts = {}) {
  const r = await fetch(url, opts);
  let data = null; try { data = await r.json(); } catch {}
  if (!r.ok) { const d = data && data.detail; throw new Error(Array.isArray(d) ? d.join('\n') : (d || r.statusText)); }
  return data;
}
function msg(id, texto, ok = true) { const el = $('#m-' + id); el.className = 'msg ' + (ok ? 'ok' : 'err'); el.textContent = texto; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Formulario de persona (reutilizado en crear y modificar) ---------- */
const CAMPOS = (modo) => `
  <div class="row">
    <label>Tipo de documento<select name="tipo_documento" required><option value="">Seleccione…</option>
      <option value="T.I">Tarjeta de identidad (T.I)</option><option value="C.C">Cédula (C.C)</option></select></label>
    <label>Nro. Documento<input name="nro_documento" inputmode="numeric" maxlength="10" pattern="[0-9]{1,10}" required ${modo==='mod'?'readonly':''}></label>
  </div>
  <label>Primer Nombre<input name="primer_nombre" maxlength="30" required></label>
  <label>Segundo Nombre (opcional)<input name="segundo_nombre" maxlength="30"></label>
  <label>Apellidos<input name="apellidos" maxlength="60" required></label>
  <div class="row">
    <label>Fecha de Nacimiento (calendario)<input type="date" name="fecha_nacimiento"></label>
    <label>…o escríbela (dd-mmm-yyyy)<input name="fecha_texto" placeholder="05-mar-2001" pattern="[0-9]{1,2}-[A-Za-z]{3}-[0-9]{4}"></label>
  </div>
  <div class="row">
    <label>Género<select name="genero" required><option value="">Seleccione…</option><option>Masculino</option><option>Femenino</option>
      <option>No binario</option><option>Prefiero no reportar</option></select></label>
    <label>Celular<input name="celular" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" required></label>
  </div>
  <label>Correo electrónico<input type="email" name="correo" required></label>
  <label>Foto (máx. 2 MB)<input type="file" name="foto" accept="image/png,image/jpeg,image/webp"></label>
  <button class="btn primary" type="submit">${modo==='mod' ? 'Guardar cambios' : 'Crear'}</button>`;
$('#f-crear').innerHTML = CAMPOS('crear');
$('#f-modificar').innerHTML = CAMPOS('mod');

function datosForm(form) {
  const fd = new FormData(form);
  const t = (fd.get('fecha_texto') || '').trim();
  if (t) fd.set('fecha_nacimiento', t);
  fd.delete('fecha_texto');
  const f = fd.get('foto');
  if (f && f.size > 2 * 1024 * 1024) throw new Error('foto: el archivo no puede superar 2 MB');
  if (f && !f.size) fd.delete('foto');
  return fd;
}

/* ---------- Crear ---------- */
$('#f-crear').onsubmit = async e => { e.preventDefault();
  try { const r = await api('/api/crear/personas', { method: 'POST', body: datosForm(e.target) });
        msg('crear', r.mensaje + ' (' + r.nro_documento + ')'); e.target.reset(); }
  catch (err) { msg('crear', err.message, false); } };

/* ---------- Modificar ---------- */
$('#f-buscar-mod').onsubmit = async e => { e.preventDefault();
  const doc = new FormData(e.target).get('doc'); const f = $('#f-modificar');
  try { const p = await api('/api/modificar/personas/' + encodeURIComponent(doc));
        ['tipo_documento','nro_documento','primer_nombre','segundo_nombre','apellidos','fecha_nacimiento','genero','correo','celular']
          .forEach(k => f.elements[k].value = p[k] ?? '');
        f.hidden = false; msg('modificar', 'Datos cargados. Edite y guarde.'); }
  catch (err) { f.hidden = true; msg('modificar', err.message, false); } };
$('#f-modificar').onsubmit = async e => { e.preventDefault();
  try { const fd = datosForm(e.target); const doc = fd.get('nro_documento'); fd.delete('nro_documento');
        const r = await api('/api/modificar/personas/' + encodeURIComponent(doc), { method: 'PUT', body: fd });
        msg('modificar', r.mensaje); }
  catch (err) { msg('modificar', err.message, false); } };

/* ---------- Consultar ---------- */
const ETIQ = { 'T.I': 'Tarjeta de identidad', 'C.C': 'Cédula' };
function ficha(p) {
  const foto = p.tiene_foto ? `<img alt="Foto" src="/api/consultar/personas/${esc(p.nro_documento)}/foto">` : '';
  return `<div class="ficha">${foto}<dl>
    <dt>Documento</dt><dd>${esc(ETIQ[p.tipo_documento])} ${esc(p.nro_documento)}</dd>
    <dt>Nombre</dt><dd>${esc(p.primer_nombre)} ${esc(p.segundo_nombre)} ${esc(p.apellidos)}</dd>
    <dt>Nacimiento</dt><dd>${esc(p.fecha_nacimiento)}</dd><dt>Género</dt><dd>${esc(p.genero)}</dd>
    <dt>Correo</dt><dd>${esc(p.correo)}</dd><dt>Celular</dt><dd>${esc(p.celular)}</dd></dl></div>`;
}
$('#f-consultar').onsubmit = async e => { e.preventDefault();
  const doc = (new FormData(e.target).get('doc') || '').trim(); const out = $('#r-consultar'); out.innerHTML = '';
  try { if (doc) { out.innerHTML = ficha(await api('/api/consultar/personas/' + encodeURIComponent(doc))); msg('consultar', ''); }
        else { const l = await api('/api/consultar/personas'); out.innerHTML = l.map(ficha).join('<hr>'); msg('consultar', l.length + ' registro(s)'); } }
  catch (err) { msg('consultar', err.message, false); } };

/* ---------- Borrar ---------- */
$('#f-borrar').onsubmit = async e => { e.preventDefault();
  const doc = new FormData(e.target).get('doc');
  if (!confirm('¿Borrar la persona con documento ' + doc + '?')) return;
  try { const r = await api('/api/borrar/personas/' + encodeURIComponent(doc), { method: 'DELETE' }); msg('borrar', r.mensaje); e.target.reset(); }
  catch (err) { msg('borrar', err.message, false); } };

/* ---------- Logs ---------- */
$('#f-logs').onsubmit = async e => { e.preventDefault();
  const q = new URLSearchParams(); new FormData(e.target).forEach((v, k) => v && q.set(k, v));
  try { const l = await api('/api/logs/logs?' + q); msg('logs', l.length + ' registro(s)');
        $('#r-logs').innerHTML = '<table><tr><th>Fecha</th><th>Tipo</th><th>Documento</th><th>Usuario</th><th>Detalle</th></tr>' +
          l.map(x => `<tr><td>${esc(new Date(x.fecha).toLocaleString())}</td><td>${esc(x.tipo_transaccion)}</td><td>${esc(x.documento)}</td><td>${esc(x.usuario)}</td><td>${esc(x.detalle)}</td></tr>`).join('') + '</table>'; }
  catch (err) { msg('logs', err.message, false); } };

mostrar('crear');
</script>
</body>
</html>
