server {
    listen 80;
    resolver 127.0.0.11 valid=5s;          # DNS interno de Docker: resuelve en cada petición,
    root /usr/share/nginx/html;            # así nginx arranca aunque "consultar" esté apagado.
    client_max_body_size 3m;

    location / { try_files $uri /index.html; }

    # /api/<servicio>/<ruta>  ->  http://<servicio>:8000/<ruta>
    location ~ ^/api/(crear|modificar|consultar|borrar|logs)/(.*)$ {
        set $svc $1;
        set $ruta $2;
        proxy_pass http://$svc:8000/$ruta$is_args$args;
        proxy_set_header Authorization $http_authorization;
        error_page 502 503 504 = @caido;
    }
    location @caido {
        default_type application/json;
        return 503 '{"detail":["El servicio no está disponible en este momento"]}';
    }
}
