name: gestion-datos

x-servicio-env: &servicio-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-personas_db}
  DB_USER: ${DB_USER:-app}
  DB_PASSWORD: ${DB_PASSWORD:-app_pass}
  AUTH_ENABLED: ${AUTH_ENABLED:-false}
  OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/gestion}
  JWKS_URL: ${JWKS_URL:-http://keycloak:8080/realms/gestion/protocol/openid-connect/certs}

x-microservicio: &microservicio
  environment: *servicio-env
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped

services:
  # ---------- Base de datos (contenedor independiente) ----------
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-personas_db}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro   # datos de ejemplo (borrar esta línea para iniciar vacío)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-personas_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Microservicios (uno por opción del menú) ----------
  crear:
    <<: *microservicio
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: crear } }
  modificar:
    <<: *microservicio
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: modificar } }
  borrar:
    <<: *microservicio
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: borrar } }
  logs:
    <<: *microservicio
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: logs } }

  # "Consultar": contenedor independiente, habilitable/deshabilitable según demanda
  #   habilitar:     docker compose --profile consulta up -d consultar
  #   deshabilitar:  docker compose stop consultar
  consultar:
    <<: *microservicio
    profiles: ["consulta"]
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: consultar } }

  # ---------- Frontend + proxy inverso ----------
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    environment:
      FRONT_AUTH_ENABLED: ${AUTH_ENABLED:-false}
      FRONT_OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/gestion}
      FRONT_OIDC_CLIENT: gestion-frontend
      FRONT_N8N_URL: http://localhost:5678
    restart: unless-stopped

  # ---------- n8n (chat de lenguaje natural + RAG) ----------
  # En el primer arranque importa la credencial de Postgres (n8n_ro) y los dos flujos de ./n8n.
  # La clave de OpenAI se configura una sola vez en la interfaz (ver n8n/README.md).
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
    entrypoint:
      - /bin/sh
      - -c
      - >
        if [ ! -f /home/node/.n8n/.sembrado ]; then
        n8n import:credentials --input=/seed/credentials.json;
        n8n import:workflow --separate --input=/seed/workflows;
        touch /home/node/.n8n/.sembrado;
        fi;
        exec n8n start
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/seed:ro
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  # ---------- SSO (activar con --profile auth) ----------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["8081:8080"]
    restart: unless-stopped

volumes:
  pgdata:
  n8n_data:
